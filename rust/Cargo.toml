[workspace]
resolver = "2"
members = ["crates/timeline", "crates/editor_api"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
flutter_rust_bridge = "2.13.0"
